[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "libipynb"
version = "0.1.0"
description = "A standalone Python library for reading, writing, validating, and manipulating Jupyter Notebook files."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "Babar Raza", email = "prorata.net@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
reference = ["nbformat==5.10.4"]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    # Exact-pinned, not a floor (LIBIPYNB-Q56): validation/schema.py's
    # SCHEMA_SOURCE_VERSION and vendored schema digests are computed
    # against nbformat 5.10.4 specifically -- a bare floor lets a fresh
    # install resolve a newer nbformat (confirmed: 5.11.1 in a fresh
    # python:3.12-slim container) and fail
    # test_declared_source_version_matches_the_installed_oracle, which a
    # dev .venv with 5.10.4 already installed from earlier work would
    # never surface locally. Matches the `reference` extra's existing
    # exact pin below.
    "nbformat==5.10.4",
]
# Linux-only: atheris has no Windows wheels and fails to build from source
# there. See fuzz/README.md.
fuzz = ["atheris>=2.3; sys_platform == 'linux'"]
# Real Jupyter kernel-protocol execution (plans/full-parity-plan.md LIBIPYNB-P4).
# Ships to end users who opt into engine="kernel"; never imported by core
# src/libipynb code -- see tests/unit/test_import_boundary.py.
# LIBIPYNB-Q22 (P0-G): ipykernel added -- jupyter_client/nbclient can launch
# a kernel process, but without an actual kernel implementation installed
# and registered (`python -m ipykernel install`), there is no kernel to
# launch. `pip install libipynb[exec]` alone was previously incomplete for
# this reason, not just a CI provisioning gap.
exec = ["jupyter_client>=8.6", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]
# Test-only cross-tool oracle comparisons (plans/full-parity-plan.md Gate G8).
# Never imported by src/libipynb; only by tests/oracle/.
oracle = ["nbdime>=4.0", "nbconvert>=7.16", "papermill>=2.6", "nbstripout>=0.7"]
# End-user-facing export adapters (LIBIPYNB-V5): HtmlExporter and
# JupytextExporter. jupytext is imported directly by adapters/export.py
# (allowed -- it is not in test_import_boundary.py's forbidden list).
# nbconvert is intentionally NOT imported anywhere in src/libipynb/ (it IS
# forbidden -- see test_import_boundary.py); HtmlExporter instead shells out
# to `python -m nbconvert` as a subprocess, the same "wrap the real tool
# without taking a Python import dependency on it" pattern already used by
# adapters/execute.py and the git diff/merge driver integration. nbconvert
# is still listed here so `pip install libipynb[export]` is a complete,
# one-line install for both adapters.
export = ["jupytext>=1.16", "nbconvert>=7.16"]

[project.scripts]
libipynb = "libipynb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"libipynb.validation" = ["schemas/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["libipynb"]

[tool.mutmut]
# LIBIPYNB-Q31 pilot (Linux-only, matches this project's own `fuzz` extra
# platform posture -- mutmut refuses to run on native Windows at all,
# confirmed directly: "To run mutmut on Windows, please use the WSL").
# Deliberately scoped to one module for the pilot; not yet a standing CI
# job. Widen `only_mutate` to the other 3 hot modules
# (adapters/execute.py, adapters/jupyter_execute.py, codec/reader.py) only
# after this scope's own baseline is recorded.
only_mutate = ["src/libipynb/codec/writer.py"]
# mutmut copies only tests/, pyproject.toml, and lockfiles into its mutated
# `mutants/` tree by default -- a couple of tests read other repo-root
# files directly (grep-confirmed: README.md, .gitlab-ci.yml) and would 404
# there otherwise. also_copy is mutmut's own intended mechanism for this,
# so used here rather than working around it by deselecting those tests.
# plans/state.json is NOT included here: also_copy uses shutil.copy2 (file
# only, does not create intermediate directories), so a nested destination
# like mutants/plans/state.json fails outright unless mutants/plans/
# already exists -- confirmed directly (FileNotFoundError). The one test
# needing it (tests/scripts/test_state_json_schema.py) also runs `git log`
# against this project's own commit history to validate VERIFIED rows,
# which is governance/plan-process metadata orthogonal to codec/writer.py's
# actual code behavior -- deselected as a whole file instead.
also_copy = ["README.md", ".gitlab-ci.yml"]
# mutmut runs pytest against a copied-and-mutated `mutants/` source tree,
# never a real site-packages install -- structurally incompatible with
# every test asserting libipynb's import origin IS site-packages (a
# legitimate packaging-integrity check in every other context, just not
# this one; grep confirmed exactly these 3 occurrences repo-wide). This
# class genuinely can't be fixed via also_copy (the assertion is about
# where the package resolves FROM, not about a missing file), so it's
# deselected rather than dropping broader test-selection scope.
pytest_add_cli_args_test_selection = [
    "--deselect=tests/integration/test_obligation_nbformat_core.py::test_core_proof_uses_installed_production_namespace",
    "--deselect=tests/package/test_production_namespace.py::test_implicit_namespace_importable",
    "--deselect=tests/unit/test_obligation_attachments.py::test_attachment_proof_uses_installed_production_namespace",
    "--ignore=tests/scripts/test_state_json_schema.py",
    # Same also_copy directory-creation limitation as plans/state.json
    # above: this file imports scripts/fetch_fixture.py directly via a
    # loader, another repo-root path outside src/libipynb, orthogonal to
    # codec/writer.py's own behavior.
    "--ignore=tests/scripts/test_fetch_fixture.py",
    # CONFIRMED root cause of every mutant showing "no tests" (pytest exit
    # code 5, "no tests collected") in earlier pilot runs: pytest-cov
    # (installed via the `test` extra) auto-registers as a pytest plugin
    # even without --cov passed, and conflicts with mutmut's own internal
    # coverage.py-based instrumentation of the same process. Disabling it
    # here was the fix that took the pilot from 100% "no tests" to real
    # kill/survive results (268 mutants: 186 killed, 61 survived, 21 no
    # tests -- see LIBIPYNB-Q19's mutation_baseline_checked for the score
    # and LIBIPYNB-Q58 for the survived-mutant follow-up).
    "-p",
    "no:cov",
]

[tool.coverage.run]
source = ["libipynb"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
