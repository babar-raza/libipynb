stages:
  - quality
  - test
  - interop
  - package

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

.python-base:
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[test]"

cache:
  key: "${CI_JOB_NAME}-${PYTHON_VERSION}"
  paths:
    - .pip-cache/

# ── Quality ──────────────────────────────────────────────────────────────────

# LIBIPYNB-Q26: ruff/mypy pinned exact, not floating -- confirmed via a real
# cross-version reproduction (a stale pre-installed ruff 0.15.22 found in an
# unrelated local CI-emulation test) that ruff's DEFAULT enabled rule set
# genuinely differs between minor versions (0.15.x enables E402 by default;
# 0.16.x does not), with no explicit [tool.ruff.lint] select in
# pyproject.toml to pin that selection down. An unpinned `pip install ruff`
# means this gate's pass/fail is not just a function of the code, but of
# whatever ruff happens to resolve as "latest" on a given day -- exactly the
# kind of non-reproducibility this whole engagement exists to close. Pinned
# to the exact versions every Gate-G1 command in this engagement was actually
# verified against.

ruff-format:
  stage: quality
  image: python:3.12-slim
  before_script:
    - pip install ruff==0.16.2
  script:
    - ruff format --check src/ tests/

ruff-lint:
  stage: quality
  image: python:3.12-slim
  before_script:
    - pip install ruff==0.16.2
  script:
    - ruff check src/ tests/

mypy:
  stage: quality
  image: python:3.12-slim
  before_script:
    # LIBIPYNB-Q56: `.[test]` alone is not enough -- adapters/jupyter_execute.py
    # and adapters/export.py conditionally import nbclient/jupytext, which are
    # only declared in the exec/export extras. In a genuinely fresh install
    # (confirmed via a from-scratch python:3.12-slim container, not just this
    # repo's own long-lived dev .venv which already had them from earlier
    # work) mypy --strict reports import-not-found for both, since it has no
    # way to resolve packages that were never installed. Installing exec+export
    # too makes the type-checking environment match what mypy actually needs
    # to check every file under src/libipynb/, not just the ones test-only
    # deps happen to cover.
    - pip install -e ".[test,exec,export]"
    - pip install mypy==2.3.0
  script:
    - mypy --strict src/libipynb/

# ── Test (Python version matrix) ─────────────────────────────────────────────

.test-template:
  stage: test
  extends: .python-base
  needs: []
  script:
    - pytest tests/unit/ tests/integration/ tests/security/ -v --tb=short
    - pytest tests/property/ -v --tb=short

test-py311:
  extends: .test-template
  variables:
    PYTHON_VERSION: "3.11"

test-py312:
  extends: .test-template
  variables:
    PYTHON_VERSION: "3.12"

test-py313:
  extends: .test-template
  variables:
    PYTHON_VERSION: "3.13"

# ── Fuzz (LIBIPYNB-V3, scheduled pipelines only — never blocks a normal push/MR) ──
# Requires a GitLab CI/CD Schedule (Settings > CI/CD > Schedules) to actually run
# periodically; that schedule itself is project-server-side config, not part of this
# file, and has not been created (no GitLab project access from this environment).
# Until a schedule exists, this job is defined but dormant — it will not appear in
# any ordinary pipeline (rules below), so it introduces no behavior change today.
# Gate G2 note: `.[fuzz]` has no atheris upper bound, so this job resolves whatever
# is latest at run time on python:3.12-slim; only atheris 2.3 on Python 3.11 (via
# WSL) has actually been run locally (plans/phase2b-execution-evidence.md) — the
# exact atheris/3.12 combination CI will install has not been locally verified.

fuzz:
  stage: test
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  needs: []
  before_script:
    - pip install -e ".[fuzz]"
  script:
    - python fuzz/fuzz_parser.py -max_total_time=120
    - python fuzz/fuzz_validator.py -max_total_time=120
    - python fuzz/fuzz_sanitizer.py -max_total_time=120
    - python fuzz/fuzz_diff_merge.py -max_total_time=120
    - python fuzz/fuzz_nan_infinity.py -max_total_time=120
    - python fuzz/fuzz_output_truncation.py -max_total_time=120

# ── Oracle and package (LIBIPYNB-Q13b, scheduled pipelines only — never blocks a normal push/MR) ──
# tests/oracle/ compares libipynb's own output against the real, actually-
# installed reference tools (nbdime/nbconvert/papermill/nbstripout, the
# `oracle` extra); tests/package/ exercises the installed-distribution
# namespace itself. Neither ran in any pipeline before this job existed.
# Requires a GitLab CI/CD Schedule (Settings > CI/CD > Schedules) to actually
# run periodically; that schedule itself is project-server-side config, not
# part of this file, and has not been created (no GitLab project access from
# this environment) -- same disclosed limitation LIBIPYNB-V3's `fuzz:` job
# above already recorded. Until a schedule exists, this job is defined but
# dormant -- it will not appear in any ordinary pipeline (rules below), so it
# introduces no behavior change today.
# Gate G2 note: `.[oracle]` pins version floors only (`nbdime>=4.0`,
# `nbconvert>=7.16`, `papermill>=2.6`, `nbstripout>=0.7`), so this job
# resolves whatever is latest at run time on python:3.12-slim; the exact
# versions CI will install have not been locally verified against this exact
# image -- only whatever happens to be installed in this repo's own working
# `.venv` has actually been run.
#
# LIBIPYNB-Q22 (P0-G): this job used to install only `.[test,oracle]` --
# neither that nor `.[exec]` (jupyter_client/nbclient) included an actual
# kernel implementation (ipykernel, now added to the `exec` extra) or
# registered a kernelspec, so tests/oracle/test_nbclient_execution_parity.py
# and tests/oracle/test_real_world_corpus_parity.py's kernel-comparison
# tests permanently, silently skipped here (pytest.importorskip("nbclient")
# never even got that far, since nbclient wasn't installed either) rather
# than exercising what this job's own comment above claims -- "compares
# libipynb's own output against the real, actually-installed reference
# tools." Now installs `.[exec]` too and registers the kernelspec the
# tests look for (`kernelspec.find_kernel_specs()` must contain "python3").

oracle-and-package:
  stage: test
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  needs: []
  before_script:
    - pip install -e ".[test,oracle,exec]"
    - python -m ipykernel install --user --name python3 --display-name "Python 3 (libipynb CI)"
  script:
    - pytest tests/oracle/ tests/package/ -v --tb=short

# ── Interoperability ─────────────────────────────────────────────────────────

interop:
  stage: interop
  image: python:3.12-slim
  before_script:
    - pip install -e ".[test,reference]"
  script:
    - pytest tests/interoperability/ -v --tb=short
  needs:
    - test-py312

# ── Package ──────────────────────────────────────────────────────────────────

package-wheel:
  stage: package
  image: python:3.12-slim
  before_script:
    - pip install build
  script:
    - python -m build --wheel
    - python -m venv /tmp/wheel-test
    - /tmp/wheel-test/bin/pip install dist/libipynb-*.whl
    - cd /tmp
    - /tmp/wheel-test/bin/python -c "from libipynb import NotebookDocument, load, validate, NotebookError; print('wheel import OK')"
    - "/tmp/wheel-test/bin/python -c \"import libipynb; import pathlib; p = pathlib.Path(libipynb.__file__).resolve(); assert 'site-packages' in str(p), f'not from site-packages: {p}'; print(f'resolved from {p}')\""
    - /tmp/wheel-test/bin/libipynb --help
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 30 days
  needs:
    - test-py312

package-sdist:
  stage: package
  image: python:3.12-slim
  before_script:
    - pip install build
  script:
    - python -m build --sdist
    - python -m venv /tmp/sdist-test
    - /tmp/sdist-test/bin/pip install dist/libipynb-*.tar.gz
    - cd /tmp
    - /tmp/sdist-test/bin/python -c "from libipynb import NotebookDocument, load, validate, NotebookError; print('sdist import OK')"
  artifacts:
    paths:
      - dist/*.tar.gz
    expire_in: 30 days
  needs:
    - test-py312

package-examples:
  stage: package
  image: python:3.12-slim
  before_script:
    - pip install -e ".[test]"
  script:
    - python examples/load_and_inspect.py
    - python examples/validate_notebook.py
  needs:
    - test-py312
