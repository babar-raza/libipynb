stages:
  - quality
  - test
  - interop
  - package

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

.python-base:
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[test]"

cache:
  key: "${CI_JOB_NAME}-${PYTHON_VERSION}"
  paths:
    - .pip-cache/

# ── Quality ──────────────────────────────────────────────────────────────────

ruff-format:
  stage: quality
  image: python:3.12-slim
  before_script:
    - pip install ruff
  script:
    - ruff format --check src/ tests/

ruff-lint:
  stage: quality
  image: python:3.12-slim
  before_script:
    - pip install ruff
  script:
    - ruff check src/ tests/

mypy:
  stage: quality
  image: python:3.12-slim
  before_script:
    - pip install -e ".[test]"
    - pip install mypy
  script:
    - mypy --strict src/libipynb/

# ── Test (Python version matrix) ─────────────────────────────────────────────

.test-template:
  stage: test
  extends: .python-base
  needs: []
  script:
    - pytest tests/unit/ tests/integration/ tests/security/ -v --tb=short
    - pytest tests/property/ -v --tb=short

test-py311:
  extends: .test-template
  variables:
    PYTHON_VERSION: "3.11"

test-py312:
  extends: .test-template
  variables:
    PYTHON_VERSION: "3.12"

test-py313:
  extends: .test-template
  variables:
    PYTHON_VERSION: "3.13"

# ── Fuzz (LIBIPYNB-V3, scheduled pipelines only — never blocks a normal push/MR) ──
# Requires a GitLab CI/CD Schedule (Settings > CI/CD > Schedules) to actually run
# periodically; that schedule itself is project-server-side config, not part of this
# file, and has not been created (no GitLab project access from this environment).
# Until a schedule exists, this job is defined but dormant — it will not appear in
# any ordinary pipeline (rules below), so it introduces no behavior change today.
# Gate G2 note: `.[fuzz]` has no atheris upper bound, so this job resolves whatever
# is latest at run time on python:3.12-slim; only atheris 2.3 on Python 3.11 (via
# WSL) has actually been run locally (plans/phase2b-execution-evidence.md) — the
# exact atheris/3.12 combination CI will install has not been locally verified.

fuzz:
  stage: test
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  needs: []
  before_script:
    - pip install -e ".[fuzz]"
  script:
    - python fuzz/fuzz_parser.py -max_total_time=120
    - python fuzz/fuzz_validator.py -max_total_time=120
    - python fuzz/fuzz_sanitizer.py -max_total_time=120
    - python fuzz/fuzz_diff_merge.py -max_total_time=120

# ── Oracle and package (LIBIPYNB-Q13b, scheduled pipelines only — never blocks a normal push/MR) ──
# tests/oracle/ compares libipynb's own output against the real, actually-
# installed reference tools (nbdime/nbconvert/papermill/nbstripout, the
# `oracle` extra); tests/package/ exercises the installed-distribution
# namespace itself. Neither ran in any pipeline before this job existed.
# Requires a GitLab CI/CD Schedule (Settings > CI/CD > Schedules) to actually
# run periodically; that schedule itself is project-server-side config, not
# part of this file, and has not been created (no GitLab project access from
# this environment) -- same disclosed limitation LIBIPYNB-V3's `fuzz:` job
# above already recorded. Until a schedule exists, this job is defined but
# dormant -- it will not appear in any ordinary pipeline (rules below), so it
# introduces no behavior change today.
# Gate G2 note: `.[oracle]` pins version floors only (`nbdime>=4.0`,
# `nbconvert>=7.16`, `papermill>=2.6`, `nbstripout>=0.7`), so this job
# resolves whatever is latest at run time on python:3.12-slim; the exact
# versions CI will install have not been locally verified against this exact
# image -- only whatever happens to be installed in this repo's own working
# `.venv` has actually been run.

oracle-and-package:
  stage: test
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  needs: []
  before_script:
    - pip install -e ".[test,oracle]"
  script:
    - pytest tests/oracle/ tests/package/ -v --tb=short

# ── Interoperability ─────────────────────────────────────────────────────────

interop:
  stage: interop
  image: python:3.12-slim
  before_script:
    - pip install -e ".[test,reference]"
  script:
    - pytest tests/interoperability/ -v --tb=short
  needs:
    - test-py312

# ── Package ──────────────────────────────────────────────────────────────────

package-wheel:
  stage: package
  image: python:3.12-slim
  before_script:
    - pip install build
  script:
    - python -m build --wheel
    - python -m venv /tmp/wheel-test
    - /tmp/wheel-test/bin/pip install dist/libipynb-*.whl
    - cd /tmp
    - /tmp/wheel-test/bin/python -c "from libipynb import NotebookDocument, load, validate, NotebookError; print('wheel import OK')"
    - "/tmp/wheel-test/bin/python -c \"import libipynb; import pathlib; p = pathlib.Path(libipynb.__file__).resolve(); assert 'site-packages' in str(p), f'not from site-packages: {p}'; print(f'resolved from {p}')\""
    - /tmp/wheel-test/bin/libipynb --help
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 30 days
  needs:
    - test-py312

package-sdist:
  stage: package
  image: python:3.12-slim
  before_script:
    - pip install build
  script:
    - python -m build --sdist
    - python -m venv /tmp/sdist-test
    - /tmp/sdist-test/bin/pip install dist/libipynb-*.tar.gz
    - cd /tmp
    - /tmp/sdist-test/bin/python -c "from libipynb import NotebookDocument, load, validate, NotebookError; print('sdist import OK')"
  artifacts:
    paths:
      - dist/*.tar.gz
    expire_in: 30 days
  needs:
    - test-py312

package-examples:
  stage: package
  image: python:3.12-slim
  before_script:
    - pip install -e ".[test]"
  script:
    - python examples/load_and_inspect.py
    - python examples/validate_notebook.py
  needs:
    - test-py312
