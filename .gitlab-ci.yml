stages:
  - quality
  - test
  - interop
  - package

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

.python-base:
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[test]"

cache:
  key: "${CI_JOB_NAME}-${PYTHON_VERSION}"
  paths:
    - .pip-cache/

# ── Quality ──────────────────────────────────────────────────────────────────

ruff-format:
  stage: quality
  image: python:3.12-slim
  before_script:
    - pip install ruff
  script:
    - ruff format --check src/ tests/

ruff-lint:
  stage: quality
  image: python:3.12-slim
  before_script:
    - pip install ruff
  script:
    - ruff check src/ tests/

mypy:
  stage: quality
  image: python:3.12-slim
  before_script:
    - pip install -e ".[test]"
    - pip install mypy
  script:
    - mypy --strict src/libipynb/

# ── Test (Python version matrix) ─────────────────────────────────────────────

.test-template:
  stage: test
  extends: .python-base
  needs: []
  script:
    - pytest tests/unit/ tests/integration/ tests/security/ -v --tb=short
    - pytest tests/property/ -v --tb=short

test-py311:
  extends: .test-template
  variables:
    PYTHON_VERSION: "3.11"

test-py312:
  extends: .test-template
  variables:
    PYTHON_VERSION: "3.12"

test-py313:
  extends: .test-template
  variables:
    PYTHON_VERSION: "3.13"

# ── Interoperability ─────────────────────────────────────────────────────────

interop:
  stage: interop
  image: python:3.12-slim
  before_script:
    - pip install -e ".[test,reference]"
  script:
    - pytest tests/interoperability/ -v --tb=short
  needs:
    - test-py312

# ── Package ──────────────────────────────────────────────────────────────────

package-wheel:
  stage: package
  image: python:3.12-slim
  before_script:
    - pip install build
  script:
    - python -m build --wheel
    - python -m venv /tmp/wheel-test
    - /tmp/wheel-test/bin/pip install dist/libipynb-*.whl
    - cd /tmp
    - /tmp/wheel-test/bin/python -c "from libipynb import NotebookDocument, load, validate, NotebookError; print('wheel import OK')"
    - /tmp/wheel-test/bin/python -c "import libipynb; import pathlib; p = pathlib.Path(libipynb.__file__).resolve(); assert 'site-packages' in str(p), f'not from site-packages: {p}'; print(f'resolved from {p}')"
    - /tmp/wheel-test/bin/libipynb --help
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 30 days
  needs:
    - test-py312

package-sdist:
  stage: package
  image: python:3.12-slim
  before_script:
    - pip install build
  script:
    - python -m build --sdist
    - python -m venv /tmp/sdist-test
    - /tmp/sdist-test/bin/pip install dist/libipynb-*.tar.gz
    - cd /tmp
    - /tmp/sdist-test/bin/python -c "from libipynb import NotebookDocument, load, validate, NotebookError; print('sdist import OK')"
  artifacts:
    paths:
      - dist/*.tar.gz
    expire_in: 30 days
  needs:
    - test-py312

package-examples:
  stage: package
  image: python:3.12-slim
  before_script:
    - pip install -e ".[test]"
  script:
    - python examples/load_and_inspect.py
    - python examples/validate_notebook.py
  needs:
    - test-py312
